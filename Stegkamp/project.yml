name: Stegkamp

options:
  bundleIdPrefix: se.stegkamp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: sv
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.0
  StegkampKit:
    path: Packages/StegkampKit

targets:
  Stegkamp:
    type: application
    platform: iOS
    sources:
      - path: Stegkamp
    settings:
      base:
        PRODUCT_NAME: Stegkamp
        PRODUCT_BUNDLE_IDENTIFIER: $(STEGKAMP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Stegkamp/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        LSApplicationQueriesSchemes:
          - swish
        NSHealthShareUsageDescription: Stegkamp läser dina steg och din gångdistans för att visa dina framsteg och räkna ut tävlingarna du är med i. Stegdata används aldrig för annonser.
        UniversalLinkDomain: $(UNIVERSAL_LINK_DOMAIN)
    entitlements:
      path: Stegkamp/Resources/Stegkamp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.associated-domains:
          - applinks:$(UNIVERSAL_LINK_DOMAIN)
        com.apple.security.application-groups:
          - group.$(STEGKAMP_BUNDLE_ID)
    dependencies:
      - package: StegkampKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging

  StegkampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StegkampTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STEGKAMP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stegkamp

  StegkampUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StegkampUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STEGKAMP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Stegkamp
    dependencies:
      - target: Stegkamp

schemes:
  Stegkamp:
    build:
      targets:
        Stegkamp: all
        StegkampTests: [test]
        StegkampUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Stegkamp
      targets:
        - name: StegkampTests
          parallelizable: true
        - name: StegkampUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
