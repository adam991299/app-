# Jarvis the Trader — all services (spec §2). Start with: docker compose up -d --wait
# Secrets come from .env (create it with scripts/init-env.sh). Only Caddy publishes a port.

x-backend: &backend
  image: jarvis-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks: [internal]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s

services:
  db:
    image: timescale/timescaledb:2.32.0-pg17
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_DB: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?kör scripts/init-env.sh först}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U jarvis -d jarvis]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    networks: [internal]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *backend
    command: [--name, api]
    environment:
      JARVIS_DATABASE_URL: postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@db/jarvis
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-localhost}
      JARVIS_PASSKEY_SETUP_CODE: ${JARVIS_PASSKEY_SETUP_CODE:-}
  broker-service:
    <<: *backend
    command: [--name, broker-service]
  risk-engine:
    <<: *backend
    command: [--name, risk-engine]
  market-data-service:
    <<: *backend
    command: [--name, market-data-service]
  strategy-engine:
    <<: *backend
    command: [--name, strategy-engine]
  research-lab:
    <<: *backend
    command: [--name, research-lab]
  news-service:
    <<: *backend
    command: [--name, news-service]
  learning-service:
    <<: *backend
    command: [--name, learning-service]
  scheduler:
    <<: *backend
    command: [--name, scheduler]
  watchdog:
    <<: *backend
    command: [--name, watchdog]
  notifier:
    <<: *backend
    command: [--name, notifier]
  backup:
    <<: *backend
    command: [--name, backup]

  web:
    image: jarvis-web:local
    build: ./web
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    networks: [internal]
    ports: ["443:443"]
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    networks: [internal]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    networks: [internal]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?kör scripts/init-env.sh först}
    volumes: [grafana-data:/var/lib/grafana]

  # Trading needs Adam's IBKR Paper login, so these two only start with:
  #   docker compose --profile broker up -d
  # The gateway's API port is never published outside the internal network (spec §10).
  execution-engine:
    <<: *backend
    profiles: [broker]
    command: [--name, execution-engine]
    environment:
      JARVIS_DATABASE_URL: postgresql+asyncpg://jarvis:${POSTGRES_PASSWORD}@db/jarvis
      JARVIS_IBKR_HOST: ib-gateway
      JARVIS_IBKR_PORT: "4004"
      JARVIS_IBKR_ACCOUNT: ${IBKR_PAPER_ACCOUNT:-}
      JARVIS_UNIVERSE: /app/config/universe_us.yaml
      JARVIS_SMTP_HOST: ${JARVIS_SMTP_HOST:-}
      JARVIS_SMTP_PORT: ${JARVIS_SMTP_PORT:-465}
      JARVIS_SMTP_USER: ${JARVIS_SMTP_USER:-}
      JARVIS_SMTP_PASSWORD: ${JARVIS_SMTP_PASSWORD:-}
      JARVIS_ALERT_EMAIL: ${JARVIS_ALERT_EMAIL:-}
    depends_on:
      db: { condition: service_healthy }
      ib-gateway: { condition: service_started }

  ib-gateway:
    profiles: [broker]
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    networks: [internal]
    environment:
      TWS_USERID: ${IBKR_PAPER_USERNAME:-}
      TWS_PASSWORD: ${IBKR_PAPER_PASSWORD:-}
      TRADING_MODE: paper
      TIME_ZONE: Europe/Stockholm

networks:
  internal:

volumes:
  db-data:
  redis-data:
  caddy-data:
  prometheus-data:
  grafana-data:
