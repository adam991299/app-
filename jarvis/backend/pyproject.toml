[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis the Trader — backend services"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.32",
    "cbor2==6.1.5",
    "exchange-calendars>=4.6",
    "fastapi>=0.115",
    "ib-async>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn>=0.32",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "httpx2>=1.0",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pandas-stubs>=3.1.0.261029",
    "pip-audit>=2.7",
    "psycopg[binary]>=3.3",
    "pytest>=8.3",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.0",
    "pytest-postgresql>=10",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "DTZ", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The fake gateway mirrors ib_async's camelCase method names.
"tests/broker/test_ibkr.py" = ["S101", "N802", "N803"]
"tests/marketdata/test_ibkr_market.py" = ["S101", "N802", "N803"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jarvis --cov-branch --cov-report=term-missing --cov-fail-under=85"
# Deprecations raised inside pandas when exchange_calendars calls it; not our code.
filterwarnings = ["error", "ignore::pandas.errors.Pandas4Warning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# SQLAlchemy's async layer runs code in greenlets; without this some lines look unrun.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
