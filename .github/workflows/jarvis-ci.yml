name: Jarvis CI

on:
  push:
    paths: ["jarvis/**", ".github/workflows/jarvis-ci.yml"]

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: 100 % coverage in money-critical modules (spec §00.3)
        run: uv run coverage report --include='src/jarvis/risk/*,src/jarvis/broker/*,src/jarvis/execution/*' --fail-under=100
      - name: Vulnerability scan (spec §10)
        run: uv run pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Vulnerability scan (spec §10)
        run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - run: scripts/init-env.sh
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose ps && docker compose logs --tail 50
      - if: always()
        run: docker compose down -v
